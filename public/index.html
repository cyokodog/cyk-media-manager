<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>cyk-media-manager</title>
  <style>
    :root {
      --bg: #1a1a1a;
      --panel: #2a2a2a;
      --input: #3a3a3a;
      --border: #444;
      --divider: #333;
      --accent: #4a7cf7;
      --accent-hover: #3a6ce7;
      --selected-bg: #1e3a6e;

      --text: #eee;
      --text-2: #aaa;
      --text-3: #888;
      --text-4: #666;
      --text-5: #555;

      --center-bg: #1e1e1e;
      --center-header: #262b38;
      --center-border: #35405c;
      --center-text: #dfe6f7;
      --center-text-2: #8fa6d8;
      --center-chip: #2f3a52;

      --danger: #e0705f;
      --danger-text: #f0a89c;
      --danger-bg: #33201f;
      --danger-border: #6b3f3a;

      --col-header-bg: #222;

      --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      font-family: system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    button { font-family: inherit; cursor: pointer; }
    button:disabled { cursor: not-allowed; }

    /* ---------- ヘッダー ---------- */

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--panel);
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }

    .header .brand {
      font-size: 13px;
      font-weight: 600;
      color: var(--text-2);
      letter-spacing: 0.02em;
      margin-right: 4px;
      white-space: nowrap;
    }

    .dir-field {
      display: flex;
      align-items: center;
      gap: 6px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 0 8px;
      height: 30px;
      flex-grow: 1;
      max-width: 620px;
    }
    .dir-field:focus-within { border-color: var(--text-4); }
    .dir-field.error { border-color: var(--danger-border); }
    .dir-field svg { flex-shrink: 0; }

    #dirInput {
      background: none;
      border: none;
      outline: none;
      color: var(--text);
      font-size: 13px;
      font-family: var(--mono);
      flex-grow: 1;
      min-width: 0;
    }
    #dirInput::placeholder { color: var(--text-5); }

    .btn {
      display: flex;
      align-items: center;
      gap: 5px;
      height: 30px;
      padding: 0 10px;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-2);
      font-size: 12px;
      white-space: nowrap;
    }
    .btn:hover:not(:disabled) { background: var(--border); }
    .btn:disabled { color: var(--text-5); border-color: var(--divider); }

    .btn-primary {
      height: 30px;
      padding: 0 14px;
      background: var(--border);
      border: none;
      border-radius: 4px;
      color: var(--text);
      font-size: 13px;
      font-weight: 500;
    }
    .btn-primary:hover:not(:disabled) { background: #555; }

    .header .count { font-size: 12px; color: var(--text-3); white-space: nowrap; }

    .header .error-msg {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--danger-text);
      white-space: nowrap;
    }

    /* 履歴ドロップダウン */

    .history-wrap { position: relative; }

    .history-menu {
      position: absolute;
      top: calc(100% + 4px);
      right: 0;
      min-width: 300px;
      max-width: 460px;
      background: #262626;
      border: 1px solid #3a3a3a;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.5);
      z-index: 20;
    }

    .history-menu .menu-title {
      padding: 8px 12px;
      background: var(--col-header-bg);
      border-bottom: 1px solid var(--divider);
      font-size: 11px;
      color: var(--text-4);
    }

    .history-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 12px;
      border-bottom: 1px solid #2f2f2f;
      cursor: pointer;
    }
    .history-item:last-child { border-bottom: none; }
    .history-item:hover { background: var(--center-chip); }
    .history-item svg { flex-shrink: 0; }
    .history-item .lines { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
    .history-item .base { font-size: 12px; color: #ccc; }
    .history-item .full {
      font-size: 10px;
      color: var(--text-4);
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .history-empty { padding: 12px; font-size: 11px; color: var(--text-5); text-align: center; }

    /* ---------- メイン 3カラム ---------- */

    .main {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 1px;
      background: var(--divider);
      flex-grow: 1;
      min-height: 0;
    }

    .col {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      min-height: 0;
    }
    .col-center { background: var(--center-bg); }

    .col-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 12px;
      background: var(--col-header-bg);
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }
    .col-center .col-header {
      background: var(--center-header);
      border-bottom-color: var(--center-border);
    }

    .col-header .title { display: flex; align-items: center; gap: 6px; }
    .col-header .title span { font-size: 12px; color: var(--text-2); font-weight: 500; }
    .col-center .col-header .title span { color: var(--center-text); font-weight: 600; }

    .col-header .chip {
      font-size: 11px;
      color: var(--center-text-2);
      background: var(--center-chip);
      border-radius: 9px;
      padding: 1px 7px;
    }

    /* 昇順・降順トグル */

    .sort-toggle {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 7px;
      background: var(--divider);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-3);
      font-size: 11px;
    }
    .sort-toggle:hover { background: var(--border); color: var(--text-2); }
    .sort-toggle .ico-desc { display: none; }
    .sort-toggle[data-dir="desc"] .ico-asc { display: none; }
    .sort-toggle[data-dir="desc"] .ico-desc { display: block; }

    .col-body { flex-grow: 1; overflow-y: auto; padding: 10px; min-height: 0; }
    .col-body::-webkit-scrollbar { width: 10px; }
    .col-body::-webkit-scrollbar-thumb { background: var(--input); border-radius: 5px; }

    .grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }

    .thumb {
      background: var(--panel);
      border: 2px solid transparent;
      border-radius: 6px;
      overflow: hidden;
      user-select: none;
      position: relative;
    }
    .thumb img {
      width: 100%;
      height: 78px;
      object-fit: contain;
      display: block;
      background: #222;
      pointer-events: none;
    }
    .thumb .name {
      padding: 3px 5px;
      font-size: 9px;
      color: var(--text-3);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .thumb .name + .date { padding: 0 5px 4px; font-size: 9px; color: #7d7d7d; }

    /* 個別リネームの入力欄 */

    .name-edit {
      display: block;
      width: 100%;
      padding: 3px 5px;
      background: var(--input);
      border: none;
      outline: 1px solid var(--accent);
      outline-offset: -1px;
      border-radius: 0 0 4px 4px;
      color: var(--text);
      font-family: inherit;
      font-size: 9px;
      min-width: 0;
    }
    .name-edit:disabled { color: var(--text-4); }

    /* 左右列のサムネイルの状態 */

    .col-source .thumb { cursor: grab; }
    .col-source .thumb:has(.name-edit) { cursor: default; }
    .col-source .thumb:active { cursor: grabbing; }

    .thumb.selected { border-color: var(--accent); background: var(--selected-bg); }
    .thumb.selected .name { color: #cfe0ff; }
    .thumb.selected .date { color: var(--center-text-2); }

    .thumb.added { opacity: 0.4; cursor: default; }
    .thumb.added:active { cursor: default; }
    .added-badge {
      position: absolute;
      top: 6px;
      right: 6px;
      display: flex;
      align-items: center;
      gap: 3px;
      background: rgba(26, 26, 26, 0.85);
      border-radius: 3px;
      padding: 2px 5px;
      font-size: 9px;
      color: var(--center-text-2);
      pointer-events: none;
    }

    .thumb.dragging { opacity: 0.3; }

    /* 全クリアボタン */

    .clear-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      height: 22px;
      padding: 0 8px;
      background: transparent;
      border: 1px solid #4a5570;
      border-radius: 4px;
      color: var(--center-text-2);
      font-size: 11px;
    }
    .clear-btn:hover:not(:disabled) { background: var(--center-chip); }
    .clear-btn:disabled { border-color: var(--input); color: var(--text-5); }

    /* 中央列のサムネイル */

    .col-center .thumb { cursor: grab; }
    .col-center .thumb:active { cursor: grabbing; }

    .seq-badge {
      position: absolute;
      top: 5px;
      left: 5px;
      background: var(--accent);
      color: #fff;
      font-size: 10px;
      font-weight: 700;
      border-radius: 3px;
      padding: 2px 6px;
      font-family: var(--mono);
      pointer-events: none;
      z-index: 1;
    }

    .remove-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      display: none;
      align-items: center;
      justify-content: center;
      width: 20px;
      height: 20px;
      padding: 0;
      background: rgba(26, 26, 26, 0.88);
      border: 1px solid #4a4a4a;
      border-radius: 50%;
      color: #ccc;
      z-index: 2;
    }
    .col-center .thumb:hover .remove-btn { display: flex; }
    .remove-btn:hover { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger-text); }

    /* 挿入位置のライン */

    .insert-line {
      position: absolute;
      width: 3px;
      background: var(--accent);
      border-radius: 2px;
      box-shadow: 0 0 8px rgba(74, 124, 247, 0.7);
      pointer-events: none;
      z-index: 5;
    }

    .col-center .col-body { position: relative; }

    /* 中央列がドロップを受け付けている状態 */

    .col-center.drop-active .col-body { background: rgba(74, 124, 247, 0.07); }
    .drop-hint {
      margin: 10px;
      border: 2px dashed var(--accent);
      border-radius: 6px;
      background: rgba(74, 124, 247, 0.07);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 30px 20px;
    }
    .drop-hint .circle {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      background: var(--accent);
      border-radius: 50%;
    }
    .drop-hint .text { font-size: 12px; color: var(--center-text-2); }

    /* 空状態 */

    .empty {
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 20px;
      text-align: center;
    }
    .empty .lead { font-size: 12px; color: #7a8497; }
    .empty .sub { font-size: 11px; color: var(--text-5); line-height: 1.6; }

    /* ---------- フッター ---------- */

    .footer {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 12px 16px;
      background: var(--panel);
      border-top: 1px solid var(--divider);
      flex-shrink: 0;
    }

    .field { display: flex; align-items: center; gap: 7px; }
    .field label { font-size: 12px; color: var(--text-3); white-space: nowrap; }

    .footer input[type="text"] {
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 4px;
      height: 30px;
      padding: 0 10px;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
      outline: none;
    }
    .footer input[type="text"]:focus { border-color: var(--text-4); }
    .footer input[type="text"]:disabled { color: var(--text-5); }
    #prefixInput { width: 200px; }
    #digitsInput, #startInput, #stepInput { width: 52px; text-align: center; padding: 0 4px; }

    .preview-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      flex-grow: 1;
      padding-left: 6px;
      border-left: 1px solid var(--input);
      min-width: 0;
    }
    .preview-info .label { font-size: 11px; color: var(--text-4); }
    .preview-info .sample {
      font-size: 12px;
      color: var(--text-5);
      font-family: var(--mono);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .btn-ghost {
      display: flex;
      align-items: center;
      gap: 6px;
      height: 32px;
      padding: 0 14px;
      background: transparent;
      border: 1px solid #4a5570;
      border-radius: 4px;
      color: var(--center-text-2);
      font-size: 13px;
    }
    .btn-ghost:disabled { border-color: var(--input); color: var(--text-5); }

    .btn-confirm {
      height: 32px;
      padding: 0 20px;
      background: var(--accent);
      border: none;
      border-radius: 4px;
      color: #fff;
      font-size: 13px;
      font-weight: 500;
    }
    .btn-confirm:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-confirm:disabled { background: var(--divider); color: var(--text-4); }

    /* ---------- リネーム確認モーダル ---------- */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 50;
    }

    .modal {
      width: min(680px, calc(100vw - 48px));
      max-height: calc(100vh - 80px);
      display: flex;
      flex-direction: column;
      background: #212121;
      border: 1px solid #383838;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.55);
    }
    .modal.has-collision { border-color: #5c3a3a; }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      border-bottom: 1px solid var(--divider);
      flex-shrink: 0;
    }
    .modal-title { font-size: 14px; font-weight: 600; color: var(--text); }
    .modal-sub { font-size: 11px; color: var(--text-4); margin-top: 3px; }
    .modal-close {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      background: none;
      border: none;
      border-radius: 4px;
      color: var(--text-3);
    }
    .modal-close:hover { background: var(--divider); color: var(--text); }

    .modal-path {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 9px 16px;
      background: #1c2436;
      border-bottom: 1px solid #2c3648;
      font-size: 11px;
      color: var(--center-text-2);
      font-family: var(--mono);
      flex-shrink: 0;
    }
    .modal-path span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal-warning {
      display: flex;
      align-items: flex-start;
      gap: 9px;
      padding: 12px 16px;
      background: var(--danger-bg);
      border-bottom: 1px solid var(--danger-border);
      flex-shrink: 0;
    }
    .modal-warning svg { flex-shrink: 0; margin-top: 1px; }
    .modal-warning .warn-title { font-size: 12px; color: var(--danger-text); font-weight: 600; }
    .modal-warning .warn-body { font-size: 11px; color: #c99287; line-height: 1.6; margin-top: 4px; }

    .modal-thead {
      display: flex;
      padding: 7px 16px;
      background: #1e1e1e;
      border-bottom: 1px solid #2f2f2f;
      font-size: 10px;
      color: var(--text-4);
      flex-shrink: 0;
    }
    .modal-thead > div { flex: 1; }
    .modal-thead .arrow-col, .modal-row .arrow-col { flex: 0 0 22px; }

    .modal-list { overflow-y: auto; flex-grow: 1; min-height: 0; }
    .modal-list::-webkit-scrollbar { width: 10px; }
    .modal-list::-webkit-scrollbar-thumb { background: var(--input); border-radius: 5px; }

    .modal-row {
      display: flex;
      align-items: center;
      padding: 8px 16px;
      border-bottom: 1px solid #2a2a2a;
      font-family: var(--mono);
      font-size: 11px;
    }
    .modal-row:last-child { border-bottom: none; }
    .modal-row .from { flex: 1; color: #999; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .modal-row .arrow-col { display: flex; justify-content: center; }
    .modal-row .to { flex: 1; display: flex; align-items: center; gap: 5px; min-width: 0; color: var(--center-text); }
    .modal-row .to .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .modal-row .to .seq { color: var(--accent); font-weight: 700; }

    .modal-row.collide { background: #2b1d1c; border-left: 2px solid var(--danger); }
    .modal-row.collide .to { color: var(--danger-text); }
    .modal-row.collide .to .seq { color: inherit; }
    .modal-row .tag {
      font-size: 9px;
      color: var(--danger);
      border: 1px solid var(--danger-border);
      border-radius: 3px;
      padding: 1px 4px;
      flex-shrink: 0;
      font-family: system-ui, sans-serif;
    }

    .modal-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      padding: 12px 16px;
      background: #1e1e1e;
      border-top: 1px solid var(--divider);
      flex-shrink: 0;
    }
    .modal-start { display: flex; align-items: center; gap: 7px; }
    .modal-start label { font-size: 11px; color: var(--text-3); }
    .modal-start span { font-size: 11px; color: var(--text-4); }
    #modalStart {
      width: 58px;
      height: 28px;
      text-align: center;
      background: var(--input);
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text);
      font-size: 12px;
      font-family: inherit;
      outline: none;
    }
    .modal.has-collision #modalStart { border-color: var(--accent); }

    .modal-actions { display: flex; gap: 8px; }
    .btn-cancel {
      height: 32px;
      padding: 0 14px;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 4px;
      color: var(--text-2);
      font-size: 13px;
    }
    .btn-cancel:hover { background: var(--divider); }

    .modal-ok {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      color: #8fbf9c;
    }

    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <!-- ヘッダー -->
  <div class="header">
    <div class="brand">cyk-media-manager</div>

    <div class="dir-field" id="dirField">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
      <input type="text" id="dirInput" placeholder="/path/to/folder" spellcheck="false" autocomplete="off">
    </div>

    <div class="history-wrap">
      <button class="btn" id="historyBtn">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>
        履歴
      </button>
      <div class="history-menu" id="historyMenu" hidden>
        <div class="menu-title">最近使ったフォルダ</div>
        <div id="historyList"></div>
      </div>
    </div>

    <button class="btn-primary" id="loadBtn">読み込み</button>

    <div class="count" id="count"></div>
    <div class="error-msg" id="errorMsg" hidden>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 9v5M12 17.5v.5"/></svg>
      <span id="errorText"></span>
    </div>
  </div>

  <!-- メイン 3カラム -->
  <div class="main">

    <div class="col col-source">
      <div class="col-header">
        <div class="title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>
          <span>作成日順</span>
        </div>
        <button class="sort-toggle" id="leftSort" data-dir="asc" title="並び順を切り替える">
          <svg class="ico-asc" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 11l6-6 6 6"/></svg>
          <svg class="ico-desc" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 13l6 6 6-6"/></svg>
          <span class="sort-label">昇順</span>
        </button>
      </div>
      <div class="col-body" id="leftBody">
        <div class="empty">
          <div class="sub">フォルダを読み込むと<br>作成日順に表示されます</div>
        </div>
      </div>
    </div>

    <div class="col col-center">
      <div class="col-header">
        <div class="title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#4a7cf7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>
          <span>リネーム対象</span>
          <div class="chip" id="centerCount">0 件</div>
        </div>
        <button class="clear-btn" id="clearBtn" disabled>
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
          全クリア
        </button>
      </div>
      <div class="col-body" id="centerBody">
        <div class="empty">
          <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="#3d4658" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2" stroke-dasharray="4 3"/><path d="M12 9v6M9 12h6"/></svg>
          <div>
            <div class="lead">リネームするファイルをここへ</div>
            <div class="sub" style="margin-top: 5px;">左右の列からドラッグして追加します<br>並べた順に連番が振られます</div>
          </div>
        </div>
      </div>
    </div>

    <div class="col col-source">
      <div class="col-header">
        <div class="title">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#888" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h10M4 12h7M4 18h4M16 5v14M16 19l3-3M16 19l-3-3"/></svg>
          <span>名前順</span>
        </div>
        <button class="sort-toggle" id="rightSort" data-dir="asc" title="並び順を切り替える">
          <svg class="ico-asc" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M6 11l6-6 6 6"/></svg>
          <svg class="ico-desc" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 13l6 6 6-6"/></svg>
          <span class="sort-label">昇順</span>
        </button>
      </div>
      <div class="col-body" id="rightBody">
        <div class="empty">
          <div class="sub">フォルダを読み込むと<br>名前順に表示されます</div>
        </div>
      </div>
    </div>
  </div>

  <!-- フッター -->
  <div class="footer">
    <div class="field">
      <label for="prefixInput">プレフィックス</label>
      <input type="text" id="prefixInput" placeholder="例: 花_ひまわり" spellcheck="false" autocomplete="off">
    </div>

    <div class="field">
      <label for="digitsInput">桁数</label>
      <input type="text" id="digitsInput" value="4">
      <label for="startInput">開始</label>
      <input type="text" id="startInput" value="10">
      <label for="stepInput">ステップ</label>
      <input type="text" id="stepInput" value="10">
    </div>

    <div class="preview-info">
      <div class="label" id="targetCount">対象 0 件</div>
      <div class="sample" id="sampleName">中央列にファイルを追加してください</div>
    </div>

    <button class="btn-ghost" id="previewBtn" disabled>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
      プレビュー
    </button>
    <button class="btn-confirm" id="renameBtn" disabled>確定</button>
  </div>

  <!-- リネーム確認モーダル -->
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <div class="modal-header">
        <div>
          <div class="modal-title" id="modalTitle">リネームの確認</div>
          <div class="modal-sub" id="modalSub"></div>
        </div>
        <button class="modal-close" id="modalClose" aria-label="閉じる">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"/></svg>
        </button>
      </div>

      <div class="modal-path">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#8fa6d8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
        <span id="modalDir"></span>
      </div>

      <div class="modal-warning" id="modalWarning" hidden>
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#e0705f" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3 2 20h20z"/><path d="M12 9v5M12 17.5v.5"/></svg>
        <div>
          <div class="warn-title" id="modalWarnTitle"></div>
          <div class="warn-body">リネーム対象に含めていないファイルと同じ名前になります。開始番号を変更すると回避できます。</div>
        </div>
      </div>

      <div class="modal-thead">
        <div>変更前</div>
        <div class="arrow-col"></div>
        <div>変更後</div>
      </div>

      <div class="modal-list" id="modalList"></div>

      <div class="modal-footer">
        <div class="modal-start">
          <label for="modalStart">開始番号</label>
          <input type="text" id="modalStart">
          <span id="modalStartHint">を変更して回避</span>
        </div>
        <div class="modal-actions">
          <button class="btn-cancel" id="modalCancel">キャンセル</button>
          <button class="btn-confirm" id="modalApply">実行</button>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
